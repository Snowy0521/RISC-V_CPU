<svg xmlns="http://www.w3.org/2000/svg" width="620" height="490" viewBox="0 0 620 490" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrow-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b33a3a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="16" text-anchor="start" fill="#222" font-weight="bold">alu (src/alu.v)</text>
<text x="20" y="46" font-size="11" text-anchor="start" fill="#555" font-weight="normal">32-bit ALU: six operations, result selected by alu_control; zero = (result == 0)</text>
<polyline points="20,80 120,80" fill="none" stroke="#222222" stroke-width="1.3"/>
<text x="24" y="76" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">a[31:0]</text>
