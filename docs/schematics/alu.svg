<text x="560" y="310" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">zero</text>
<text x="20" y="478" font-size="10" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">Note: SLT compares unsigned; there is no XOR or shift unit (see README, Known Limitations).</text>
