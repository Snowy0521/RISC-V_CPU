<text x="446" y="410" font-size="10" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">other codes -&gt; 0</text>
<polyline points="436,255.0 600,255.0" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
