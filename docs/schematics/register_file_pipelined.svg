<text x="20" y="405" font-size="10" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">Write-through: wr_hitN = we &amp;&amp; waddr == raddrN &amp;&amp; waddr != 0; a read of the register being written returns wdata (covers WB -&gt; ID).</text>
