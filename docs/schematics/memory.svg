<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="arrow-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b33a3a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="16" text-anchor="start" fill="#222" font-weight="bold">memory (src/memory.v)</text>
<text x="20" y="46" font-size="11" text-anchor="start" fill="#555" font-weight="normal">Word-addressed 8 KB memory, combinational read, synchronous write</text>
<rect x="280" y="70" width="180" height="220" rx="4" fill="#fdf0e1" stroke="#b86b16" stroke-width="1.5"/>
<text x="370.0" y="150.83333333333334" font-size="10" text-anchor="middle" fill="#222" font-weight="bold">mem[0:2047]</text>
<text x="370.0" y="163.83333333333334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">2048 x 32-bit (8 KB)</text>
<text x="370.0" y="176.83333333333334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">index = addr[12:2]</text>
<text x="370.0" y="189.83333333333334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal"></text>
<text x="370.0" y="202.83333333333334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">initial: zero, then</text>
<text x="370.0" y="215.83333333333334" font-size="10" text-anchor="middle" fill="#222" font-weight="normal">$readmemh(bin/firmware.img)</text>
<polyline points="20,110 280,110" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
<text x="24" y="106" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">addr[31:0]</text>
<polyline points="20,190 280,190" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
<text x="24" y="186" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">wdata[31:0]</text>
<polyline points="20,240 280,240" fill="none" stroke="#b33a3a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-ctrl)"/>
<text x="24" y="236" font-size="10" text-anchor="start" fill="#b33a3a" font-weight="normal">mem_write</text>
<polyline points="20,330 370,330 370,292" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
<text x="24" y="326" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">clk (write on posedge)</text>
<polyline points="364,290 370,282 376,290" fill="none" stroke="#b86b16" stroke-width="1.3"/>
<polyline points="460,125 640,125" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
<text x="470" y="121" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">mem[addr[12:2]]</text>
<polygon points="640,105 666,117.0 666,173.0 640,185" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.5"/>
<text x="643" y="128" font-size="9" text-anchor="start" fill="#3b6ea8" font-weight="normal">1</text>
<text x="643" y="168" font-size="9" text-anchor="start" fill="#3b6ea8" font-weight="normal">0</text>
<text x="653.0" y="100" font-size="10" text-anchor="middle" fill="#b33a3a" font-weight="normal">mem_read</text>
<polyline points="618,165 640,165" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
<text x="615" y="168.5" font-size="10" text-anchor="end" fill="#222222" font-weight="normal">32'b0</text>
<polyline points="666,145.0 780,145.0" fill="none" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow-data)"/>
<text x="700" y="140.0" font-size="10" text-anchor="start" fill="#222222" font-weight="normal">rdata[31:0]</text>
<text x="20" y="375" font-size="10" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">Word accesses only: addr[1:0] and addr[31:13] are ignored (no byte / halfword access).</text>
</svg>
